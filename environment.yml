# =============================================================================
# taccap-gripper development environment
# =============================================================================
#
# Create:    mamba env create -f environment.yml
# Activate:  mamba activate taccap
# Update:    mamba env update -f environment.yml
# =============================================================================

name: taccap

channels:
  - conda-forge

dependencies:
  # Build tools
  - cmake>=3.20
  - ninja
  - pkg-config
  - make

  # C++ toolchain
  - gcc=14.*
  - gxx=14.*
  - gcc_linux-64=14.*
  - gxx_linux-64=14.*

  # C++ deps. The Camera component links opencv_core + opencv_videoio; use
  # libopencv (C++ only) here. The Python cv2 binding is pinned via pip below
  # to opencv-python==4.12.0.88 to align with the rest of the XenseRobotics
  # Python toolchain (xense-flare etc.). spdlog (header-only) backs the shared
  # logger; it pulls in fmt as a transitive dep. The logger is registry-free
  # (see cpp/src/log.cpp) so the spdlog version is not ABI-coupled to other
  # spdlog copies in a consumer process; pinned for reproducibility.
  - libopencv=4.12.0
  - spdlog=1.14.1

  # Testing
  - gtest=1.17.0

  # Python
  - python=3.12
  - pybind11
  - scikit-build-core
  # xensesdk (below) requires numpy<=2.2.4. Pin it here so conda installs a
  # numpy pip will accept; leave it floating and pip replaces conda's numpy
  # with its own wheel on every env create, two copies fighting over one
  # site-packages.
  - numpy=2.2.4
  - pytest
  # Needed for `pre-commit install`, which .pre-commit-config.yaml asks every
  # clone to run once. Without it the repo has rules that only CI enforces.
  - pre-commit
  # Package installs go through uv rather than pip. It targets the active
  # conda env on its own (prints the prefix it picked, which pip does not) and
  # its resolve/install overhead is lower -- measured on a warm build dir,
  # 0.5 s against pip's 1.0 s. Do not expect more than that: the CMake compile
  # dominates either tool, and both drive the same scikit-build-core backend.
  # pip stays available, and conda's own `pip:` section below still uses it.
  - uv
  - pip
  - pip:
      - opencv-python==4.12.0.88   # pinned across XenseRobotics SDKs
      # Ruff is pinned exactly, and from pip rather than conda-forge, because
      # CI enforces it: conda-forge tops out at 0.15.x while the gate runs
      # 0.16.x, and the two disagree about real things — 0.16 moved I001 and
      # friends into the default rule set, and 0.16.8 began formatting Python
      # inside Markdown fences. A dev running a different build than the gate
      # finds out from a red CI. Bump this and .github/workflows/ci.yml together.
      - ruff==0.16.8
      # Visuotactile (GSPS/OG) sensors are read through xensesdk, not this SDK;
      # the tactile examples and gripper_console.py --rerun need it. Its own
      # pins (numpy<=2.2.4, opencv-python<=4.12.0.88, cryptography==43.0.3)
      # are why numpy is pinned above.
      - xensesdk==2.2.2
      # The viewer behind rerun_viewer.py and gripper_console.py --rerun.
      - rerun-sdk==0.41.0
