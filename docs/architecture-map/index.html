<!doctype html>
<title>TacCap 运行地图</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* 布局：一屏工具。左侧可平移缩放的分层地图（像一张接线图），右侧是场景演示 / 详情面板；窄屏上下堆叠。 */
:root {
  --bg: #e8edeb;
  --surface: #f8faf9;
  --surface-2: #eef3f1;
  --band: #dfe6e3;
  --band-line: #c9d3d0;
  --ink: #16252a;
  --muted: #56686c;
  --rule: #c4cfcc;
  --hl: #c2410c;
  --hl-soft: #fbe3d3;
  --sync: #1f4e79;
  --async: #7a3f9e;
  --data: #2b7a4b;
  --manual: #b45309;
  --build: #6b7480;
  --branch: #b42318;
  --ok: #2b7a4b;
  --warn: #a16207;
  --bad: #b42318;
  --ext: #e3e8e6;
  --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --panel-w: 420px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1618; --surface: #162023; --surface-2: #1c282b; --band: #142022; --band-line: #263437;
    --ink: #dbe5e3; --muted: #93a5a8; --rule: #2d3c3f; --hl: #fb8a4c; --hl-soft: #43261a;
    --sync: #84b4e4; --async: #c69ce2; --data: #6fcf97; --manual: #f0a35a; --build: #9aa4ae; --branch: #f08a80;
    --ok: #6fcf97; --warn: #e3b341; --bad: #f08a80; --ext: #1a2528; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1618; --surface: #162023; --surface-2: #1c282b; --band: #142022; --band-line: #263437;
  --ink: #dbe5e3; --muted: #93a5a8; --rule: #2d3c3f; --hl: #fb8a4c; --hl-soft: #43261a;
  --sync: #84b4e4; --async: #c69ce2; --data: #6fcf97; --manual: #f0a35a; --build: #9aa4ae; --branch: #f08a80;
  --ok: #6fcf97; --warn: #e3b341; --bad: #f08a80; --ext: #1a2528; color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.6 var(--f-body); }
.app { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr; padding-top: env(safe-area-inset-top, 0px); }

header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 10px 16px; border-bottom: 1px solid var(--rule); background: var(--surface); }
header h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: .02em; }
header h1 small { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 8px; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.btn { font: inherit; font-size: 13px; padding: 4px 10px; border: 1px solid var(--rule); background: var(--surface-2); color: var(--ink); border-radius: 6px; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: .4; cursor: default; }
.tools label { font-size: 13px; color: var(--muted); display: inline-flex; gap: 4px; align-items: center; }
#legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
.lg { display: inline-flex; align-items: center; gap: 5px; }
.sw { display: inline-block; width: 18px; height: 11px; border-radius: 3px; border: 1.5px dashed var(--muted); background: var(--ext); }
.sw-opt { border-style: dotted; background: var(--surface); }
:focus-visible { outline: 2px solid var(--hl); outline-offset: 2px; }

main { display: grid; grid-template-columns: minmax(0, 1fr) var(--panel-w); min-height: 0; }
.stage { position: relative; min-width: 0; min-height: 0; }
#map { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; background: var(--bg); }
#map.panning { cursor: grabbing; }
.zoom { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
.zoom .btn { width: 34px; padding: 4px 0; text-align: center; background: var(--surface); }
#selfcheck { position: absolute; left: 12px; bottom: 12px; background: var(--bad); color: var(--surface); padding: 4px 10px; border-radius: 6px; font-size: 13px; }

/* ---- SVG ---- */
.band-bg { fill: var(--band); stroke: var(--band-line); }
.band.is-collapsed .band-bg { fill: transparent; stroke-dasharray: 3 4; }
.band-title { fill: var(--muted); font: 600 12px var(--f-body); letter-spacing: .06em; cursor: pointer; }
.band-title:hover { fill: var(--ink); }
.node { cursor: pointer; }
.node rect { fill: var(--surface); stroke: var(--ink); stroke-width: 1.2; }
.node.nk-external rect, .node.nk-asset rect { fill: var(--ext); stroke: var(--muted); stroke-dasharray: 5 3; }
.node.nk-optional rect { stroke-dasharray: 2 3; }
.node.nk-manual rect { fill: var(--ext); stroke: var(--manual); stroke-dasharray: 7 3 2 3; }
.node.bandnode rect { fill: var(--surface); stroke: var(--rule); stroke-width: 1.2; }
.node:hover rect { stroke: var(--hl); }
.node.selected rect { stroke: var(--hl); stroke-width: 2.4; }
.n-title { fill: var(--ink); font: 600 13.5px var(--f-body); pointer-events: none; }
.n-sub { fill: var(--muted); font: 11px var(--f-mono); pointer-events: none; }
.cdot { stroke: var(--surface); stroke-width: 1.5; }
.cdot.conf-inferred { fill: var(--warn); }
.cdot.conf-unverified { fill: var(--bad); }

.edge { fill: none; stroke-width: 1.5; }
.edge.k-sync { stroke: var(--sync); }
.edge.k-async { stroke: var(--async); stroke-dasharray: 7 4; }
.edge.k-data { stroke: var(--data); stroke-dasharray: 2 3; stroke-width: 1.8; }
.edge.k-manual { stroke: var(--manual); stroke-dasharray: 8 3 2 3; }
.edge.k-build { stroke: var(--build); stroke-dasharray: 1 4; stroke-linecap: round; }
.edge.unverified { opacity: .55; }
.edge.sel { stroke-width: 2.4; }
.arrow.k-sync { fill: var(--sync); } .arrow.k-async { fill: var(--async); } .arrow.k-data { fill: var(--data); }
.arrow.k-manual { fill: var(--manual); } .arrow.k-build { fill: var(--build); } .arrow.hl { fill: var(--hl); }
.elabel { font: 11px var(--f-body); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
.elabel.k-sync { fill: var(--sync); } .elabel.k-async { fill: var(--async); } .elabel.k-data { fill: var(--data); }
.elabel.k-manual { fill: var(--manual); } .elabel.k-build { fill: var(--build); }
.elabel.hl { fill: var(--hl); font-weight: 700; font-size: 12px; }

#map.focus .edge:not(.hl), #map.focus .node:not(.hl):not(.selected) { opacity: .16; }
#map.focus .elabel:not(.hl) { opacity: .3; }
#map .edge.hl { stroke: var(--hl); stroke-width: 3; opacity: 1; }
#map .node.hl rect { stroke: var(--hl); stroke-width: 2.6; fill: var(--hl-soft); }
@media (prefers-reduced-motion: no-preference) {
  #map .edge.hl { animation: flow 1.1s linear infinite; }
  @keyframes flow { from { stroke-dashoffset: 22; } to { stroke-dashoffset: 0; } }
  #map .edge.hl.k-sync { stroke-dasharray: 14 4; }
}

/* ---- panel ---- */
aside { border-left: 1px solid var(--rule); background: var(--surface); display: grid; grid-template-rows: auto 1fr; min-height: 0; min-width: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--rule); }
.tab { flex: 1; font: inherit; font-size: 13px; padding: 9px 4px; border: 0; background: transparent; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--hl); font-weight: 600; }
.pane { overflow-y: auto; padding: 14px 16px 28px; min-width: 0; padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px)); }
.pane h2 { font-size: 17px; margin: 0 0 6px; text-wrap: balance; }
.pane h3 { font-size: 15px; margin: 18px 0 6px; text-wrap: balance; }
.pane h4 { font-size: 12px; margin: 16px 0 4px; color: var(--muted); letter-spacing: .08em; font-weight: 600; }
.pane p { margin: 6px 0; }
.hint { color: var(--muted); }
.muted { color: var(--muted); }
code, .ev-ref, .where { font-family: var(--f-mono); font-size: 12px; }
.node-head code { color: var(--muted); }

#scen-pick { display: grid; gap: 6px; margin-bottom: 12px; }
.scen-btn { font: inherit; text-align: left; display: flex; justify-content: space-between; flex-direction: row-reverse; gap: 8px; padding: 7px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface-2); color: var(--ink); cursor: pointer; }
.scen-btn:hover { border-color: var(--muted); }
.scen-btn.on { border-color: var(--hl); background: var(--hl-soft); font-weight: 600; }
.scen-n { color: var(--muted); font-size: 12px; font-weight: 400; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tr { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0 0 10px; font-size: 13px; }
.tr dt { color: var(--muted); } .tr dd { margin: 0; }
.stepper { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 8px 0; }
.count { font-variant-numeric: tabular-nums; color: var(--muted); }
.step-card { border: 1px solid var(--rule); border-left: 4px solid var(--muted); border-radius: 6px; padding: 10px 12px; background: var(--surface-2); }
.step-card.k-sync { border-left-color: var(--sync); } .step-card.k-async { border-left-color: var(--async); }
.step-card.k-data { border-left-color: var(--data); } .step-card.k-branch { border-left-color: var(--branch); }
.step-card.k-manual { border-left-color: var(--manual); }
.step-card h3 { margin: 6px 0 4px; }
.step-meta { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-block; font-size: 11.5px; line-height: 1.5; padding: 0 7px; border-radius: 999px; border: 1px solid var(--rule); color: var(--muted); background: var(--surface); }
.chip.kind-sync { color: var(--sync); border-color: var(--sync); } .chip.kind-async { color: var(--async); border-color: var(--async); }
.chip.kind-data { color: var(--data); border-color: var(--data); } .chip.kind-branch { color: var(--branch); border-color: var(--branch); }
.chip.kind-manual { color: var(--manual); border-color: var(--manual); } .chip.kind-build { color: var(--build); border-color: var(--build); }
.chip.conf-confirmed { color: var(--ok); border-color: var(--ok); }
.chip.conf-inferred { color: var(--warn); border-color: var(--warn); }
.chip.conf-unverified { color: var(--bad); border-color: var(--bad); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.link-chip { cursor: pointer; font: inherit; font-size: 12px; color: var(--ink); }
.evidence { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 4px; }
.evidence li { display: grid; gap: 0; min-width: 0; }
.ev-ref { text-align: left; border: 0; background: none; padding: 0; color: var(--sync); cursor: copy; overflow-wrap: anywhere; }
.ev-ref:hover { text-decoration: underline; }
.ev-ref.copied::after { content: "  已复制路径"; color: var(--ok); font-family: var(--f-body); }
.ev-note { color: var(--muted); font-size: 12.5px; }
.steps { list-style: none; padding: 0; margin: 14px 0; display: grid; gap: 2px; }
.steps button { font: inherit; font-size: 13px; width: 100%; text-align: left; display: flex; gap: 8px; align-items: baseline; padding: 3px 6px; border: 0; border-radius: 4px; background: none; color: var(--muted); cursor: pointer; }
.steps li.cur button { background: var(--hl-soft); color: var(--ink); font-weight: 600; }
.steps .dot { width: 8px; height: 8px; border-radius: 2px; flex: none; background: var(--muted); transform: translateY(-1px); }
.steps .k-sync .dot { background: var(--sync); } .steps .k-async .dot { background: var(--async); }
.steps .k-data .dot { background: var(--data); } .steps .k-branch .dot { background: var(--branch); }
.steps .k-manual .dot { background: var(--manual); }
.rel { list-style: none; padding: 0; margin: 4px 0; display: grid; gap: 4px; }
.link { font: inherit; border: 0; background: none; padding: 0; color: var(--ink); text-decoration: underline; text-decoration-color: var(--rule); cursor: pointer; }
.link:hover { text-decoration-color: var(--hl); }
.need { font-size: 13px; padding: 6px 8px; border-radius: 4px; background: var(--surface-2); }
.obj { border-top: 1px solid var(--rule); padding: 10px 0; }
.obj h3 { margin: 0; }
.obj .where { color: var(--muted); }
.obj.flash { background: var(--hl-soft); }
.chip.st { color: var(--ink); }
.base { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.legend-conf { display: grid; gap: 4px; font-size: 13px; }
.disc { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
.disc li { border-left: 3px solid var(--rule); padding-left: 10px; }
.tag { display: inline-block; font-size: 11px; padding: 0 5px; margin-right: 6px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--rule); color: var(--muted); }
.tag.code { color: var(--ok); border-color: var(--ok); }
.ok { color: var(--ok); }
.errs { color: var(--bad); }

@media (max-width: 860px) {
  main { grid-template-columns: minmax(0, 1fr); grid-template-rows: 52% 48%; }
  aside { border-left: 0; border-top: 1px solid var(--rule); }
  header h1 small { display: none; }
}
</style>

<div class="app">
  <header>
    <h1>TacCap 运行地图<small>xense.taccap SDK · 架构与运行流程</small></h1>
    <div class="tools">
      <button class="btn" id="btn-collapse" type="button">全局概览</button>
      <button class="btn" id="btn-expand" type="button">展开全部模块</button>
      <button class="btn" id="btn-reset" type="button">重置视图</button>
      <label><input type="checkbox" id="opt-labels"> 显示全部连线说明</label>
      <label><input type="checkbox" id="opt-expand" checked> 演示时自动展开</label>
    </div>
    <div id="legend" aria-label="图例"></div>
  </header>
  <main>
    <div class="stage">
      <svg id="map" role="img" aria-label="SDK 分层架构图：拖动平移，滚轮缩放，点击模块查看详情"></svg>
      <div class="zoom">
        <button class="btn" id="btn-in" type="button" aria-label="放大">+</button>
        <button class="btn" id="btn-out" type="button" aria-label="缩小">−</button>
      </div>
      <div id="selfcheck" hidden></div>
    </div>
    <aside>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="scen" aria-selected="true" type="button">场景演示</button>
        <button class="tab" role="tab" data-tab="node" aria-selected="false" type="button">模块详情</button>
        <button class="tab" role="tab" data-tab="obj" aria-selected="false" type="button">业务对象</button>
        <button class="tab" role="tab" data-tab="trust" aria-selected="false" type="button">可信度</button>
      </div>
      <div class="pane" id="pane-scen">
        <div id="scen-pick"></div>
        <div id="scen-body"></div>
      </div>
      <div class="pane" id="pane-node" hidden></div>
      <div class="pane" id="pane-obj" hidden></div>
      <div class="pane" id="pane-trust" hidden></div>
    </aside>
  </main>
</div>

<script src="data.js"></script>
<script src="scenarios.js"></script>
<script src="app.js"></script>
