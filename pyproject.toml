[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "taccap-gripper"
version = "0.2.4"
description = "TacCap-Gripper multimodal tactile gripper SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "XenseRobotics Co., Ltd." }]
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/XenseRobotics-AI/TacCap-Gripper"

# Ruff's default rule set is not stable across releases: 0.16 turned on I001,
# BLE001, S110 and others that earlier versions left off, which is how a repo
# that was clean silently becomes un-gateable. Pin what we enforce so a ruff
# upgrade changes the version, not the contract.
#
# What is deliberately NOT enforced: BLE001 and S110. This SDK swallows
# exceptions on purpose in teardown and best-effort paths (see
# FollowerGripper release, IMU::on_data, the controller stop() paths) and those
# handlers carry comments explaining why; turning them into errors would
# reward refactoring documented behaviour into noqa comments.
[tool.ruff]
target-version = "py310"
# Markdown is documentation, not source. Ruff 0.16.8 began formatting Python
# inside fenced code blocks, which would flatten the trailing-comment columns
# the README snippets use deliberately — two adjacent comments that explain an
# ordering read as a pair only while they line up. Docs stay hand-formatted.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# All three entries below are false positives, not accepted misspellings —
# scoped as narrowly as the tool allows so a real typo of the same shape is
# still caught.
[tool.typos.default.extend-identifiers]
# struct termios tio — the conventional name for a termios struct (termios.h).
tio = "tio"
# Unit conversion: raw magnetometer counts * kCuTtoUT -> microtesla.
kCuTtoUT = "kCuTtoUT"

[tool.typos.default.extend-words]
# "mis-set" as in wrongly configured, used in the impedance backstop comments.
mis = "mis"

[tool.scikit-build]
wheel.packages = ["python/xense"]
cmake.version = ">=3.20"
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"

[tool.scikit-build.cmake.define]
TACCAP_BUILD_PYTHON = "ON"
TACCAP_BUILD_EXAMPLES = "OFF"
