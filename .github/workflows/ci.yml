name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing in this workflow writes to the repository. The drift job additionally
# handles a token for a PRIVATE repo, so a compromised step having only read
# access to this one is the difference that matters.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # OpenCV (Camera component) and spdlog (shared logger) are hard
      # dependencies of taccap_core; GTest backs the unit tests. Everything
      # else the SDK needs is header-only or in-tree.
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build libopencv-dev libspdlog-dev libgtest-dev \
            python3-dev

      # pybind11 comes from pip, NOT apt. pybind11 is header-only, so the copy
      # present at build time is the one compiled into the extension, and the
      # two differ in ways this SDK can see: apt ships 2.11.1, where a
      # py::enum_ member exposes `.name` as a bound method, while 2.12+ / 3.x
      # produce a native Python enum whose `.name` is a string. Building
      # against apt meant CI validated a binary no user would ever get — and
      # said so by failing four binding tests that pass everywhere else.
      # `>=2.12` is the floor pyproject already declares for the build.
      - name: Install Python build and test dependencies
        run: python3 -m pip install --break-system-packages 'pybind11>=2.12' pytest numpy

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DTACCAP_BUILD_TESTS=ON -DTACCAP_BUILD_EXAMPLES=ON \
            -Dpybind11_DIR="$(python3 -m pybind11 --cmakedir)"

      - name: Build
        run: cmake --build build

      # The payload static_asserts fire at compile time, so reaching this step
      # already proves the mirror is self-consistent; this runs the behaviour.
      - name: Unit tests
        run: ./build/cpp/tests/taccap_unit_tests

      # The build above already put _taccap_native and libtaccap_core into
      # python/xense/taccap/, and python/tests/conftest.py puts that directory
      # first on sys.path and asserts the extension came from this checkout —
      # so there is nothing to install and no risk of testing a different copy.
      #
      # This runs the guards a C++ test structurally cannot: that the bound
      # config surface still has the fields and defaults downstream code sets,
      # that the version is single-sourced, that numpy views are not
      # zero-stride, and that the docstrings are still there.
      - name: Python tests
        run: python3 -m pytest python/tests -q

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Runs the same hooks a developer gets from `pre-commit install`: the
      # ruff pair below plus gitleaks, zizmor, typos and the whitespace/format
      # checks. Keeping both here is deliberate — the ruff steps give a precise
      # annotation on the diff, which pre-commit's aggregate output does not.
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

      # The enforced rule set is pinned in pyproject.toml, not taken from
      # ruff's defaults — those broaden between releases, which would turn an
      # unrelated ruff upgrade into a red build.
      # Pinned, not "latest". The action reported "Could not parse version from
      # pyproject.toml. Using latest version" and picked up a ruff that formats
      # Python inside Markdown fences, which the developer's build did not —
      # so the gate failed on files that were clean locally. Keep this in step
      # with the `ruff==` pin in environment.yml.
      - uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6 # v3
        with:
          version: 0.16.8
          args: check --output-format=github

      - uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6 # v3
        with:
          version: 0.16.8
          args: format --check

  protocol-drift:
    name: protocol mirror vs firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # tc-gu-01 is PRIVATE and this repo is public, so the clone needs a
      # credential. Configure a read-only deploy key or a fine-grained PAT
      # scoped to that one repo as the FIRMWARE_REPO_TOKEN secret.
      #
      # Fork PRs do not receive the private-repo credential. On trusted runs
      # a missing credential is a configuration error, not a clean mirror.
      - name: Check firmware access
        id: firmware
        env:
          TOKEN: ${{ secrets.FIRMWARE_REPO_TOKEN }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -z "$TOKEN" ]; then
            if [ "$FORK_PR" != true ]; then
              echo "::error::FIRMWARE_REPO_TOKEN is required for protocol comparison"
              exit 1
            fi
            echo "::notice::Private firmware headers unavailable to fork PR"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      # #29 introduces the wire protocol together with firmware PR #23.
      # All other runs, including pushes after merge, track the firmware base.
      - name: Fetch firmware reference headers
        if: steps.firmware.outputs.available == 'true'
        uses: actions/checkout@v5
        with:
          repository: XenseRobotics-AI/tc-gu-01
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 29 && 'refs/pull/23/head' || 'hw_v1.1.0' }}
          path: third_party/firmware/tc-gu-01
          token: ${{ secrets.FIRMWARE_REPO_TOKEN }}
          persist-credentials: false
          sparse-checkout: |
            App/protocol
            App/drivers

      - name: Check protocol mirror
        if: steps.firmware.outputs.available == 'true'
        run: python3 scripts/check_protocol_drift.py --require

      # Leaves nothing on disk that a later step could publish; the clone lives
      # in a gitignored path, but be explicit rather than rely on that.
      - name: Remove firmware clone
        if: always()
        run: rm -rf third_party/firmware
